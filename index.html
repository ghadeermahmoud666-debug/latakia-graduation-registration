<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102d4f" />
    <meta name="description" content="منصة التسجيل لحفلات التخرج في جامعة اللاذقية" />
    <meta name="color-scheme" content="light" />
    <title>تسجيل حفلات التخرج | جامعة اللاذقية</title>
    <style>
      html,body{margin:0;min-width:320px;background:#f8f9fb;color:#182d43;font-family:Tahoma,Arial,sans-serif}
      .boot-fallback{min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
      .boot-fallback-card{width:min(100%,420px);padding:28px 20px;background:#fff;border:1px solid #e3e8ee;border-radius:18px;box-shadow:0 14px 42px rgba(17,46,77,.07)}
      .boot-fallback h1{font-size:22px;margin:0 0 12px;color:#102d4f}.boot-fallback p{font-size:15px;line-height:1.9;color:#667788;margin:0}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-fallback"><div class="boot-fallback-card"><h1>منصة التسجيل لحفلات التخرج</h1><p>جارٍ تحميل الموقع…</p></div></div></div>
    <script>
      window.__latakiaBootTimer = window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.querySelector('.boot-fallback')) {
          root.innerHTML = '<div class="boot-fallback"><div class="boot-fallback-card"><h1>تعذّر تحميل الموقع</h1><p>لم تصل ملفات تشغيل الواجهة إلى المتصفح. أعد تحميل الصفحة، وإذا استمرت المشكلة فتحقّق من عملية النشر وملفات JavaScript في Cloudflare.</p></div></div>';
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
